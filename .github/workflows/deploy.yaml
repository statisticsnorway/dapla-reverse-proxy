name: Deploy to nais-prod

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Which version should be deployed"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Deploy to Nais
        uses: nais/deploy/actions/deploy@157203210ef983b1d2fb32db50d177043ce95ebd # v2
        env:
          TEAM: dapla-platform
          CLUSTER: prod
          RESOURCE: .nais/nais.yaml
          VAR: image=europe-north1-docker.pkg.dev/${{ secrets.NAIS_MANAGEMENT_PROJECT_ID }}/dapla-platform/dapla-reverse-proxy:${{ github.event.inputs.image_version }}
